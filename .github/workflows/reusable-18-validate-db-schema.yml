# Local copy of the ucsb-cs156/workflows reusable workflow "18-validate-db-schema.yml@Division7-patch-1",
# changed only to run on ubuntu-24.04 instead of ubuntu-latest.
# Why: ubuntu-latest is now Ubuntu 26.04, which the embedded MongoDB
# library used in tests (flapdoodle) does not support yet, so tests that start
# embedded Mongo fail. Once the shared workflow is fixed, the callers can point
# back to ucsb-cs156/workflows and this file can be deleted.
# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: "(reusable) 18-validate-db-schema: Ensure Migration File Matches Entity Files"

on:
  workflow_call:
    secrets:
      GH_TOKEN:
        required: true
    inputs:
      JAVA_DISTRIBUTION:
        required: false
        type: string
        default: 'temurin'
      WEBHOOK_SECRET:
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  run-schema-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4
    - name: Set up Java (version from .java-version file)
      uses: actions/setup-java@v4
      with:
         distribution: ${{ inputs.JAVA_DISTRIBUTION }} 
         java-version-file: ./.java-version
         cache: 'maven'
         cache-dependency-path: 'pom.xml' 
  
    - name: Build with Maven
      env:
        WEBHOOK_SECRET: ${{ inputs.WEBHOOK_SECRET }}
      run: | 
        mvn -ntp spring-boot:run -Dspring-boot.run.arguments="--spring.jpa.hibernate.ddl-auto=validate"&
        SERVER_PROCESS_ID=$!
        ELAPSED=0
        TIMEOUT=150
        while [ "$ELAPSED" -lt "$TIMEOUT" ]; do
          if curl -sf "http://localhost:8080"; then
            echo "server successfully reached. DB is valid."
            kill "$SERVER_PROCESS_ID"
            exit 0
          fi
          sleep 30
          ELAPSED=$((ELAPSED + 30))
        done
        echo "Your database migrations do not match your entity files. Please inspect any changes made to your migration files or entities."
        echo "The problematic changes should be listed by Spring Boot above."
        exit 1
